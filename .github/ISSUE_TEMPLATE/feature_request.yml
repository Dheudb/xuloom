name: 功能建议
description: 新的扩展点、工具、适配器或行为改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在做不到或很麻烦的具体场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 如果涉及公开 API（EngineConfig、PluginAPI、Hook、ModelAdapter），请写出期望的调用方式
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 能否用现有插件、Hook 或适配器实现
