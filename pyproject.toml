[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["desktop", "build", ".venv*"]

[tool.ruff.lint]
# Correctness only (syntax errors, undefined names, unused imports/variables).
# Style rules are deliberately off: the codebase predates the linter.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The public API is re-exported lazily; the TYPE_CHECKING imports exist for type checkers.
"xuloom/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
# Typed public API surface, checked in CI; widen this list as modules gain annotations.
# QueryEngine and its mixins are checked against xuloom/core/engine_state.py, the shared engine state
# generated by scripts/gen_engine_state.py (see docs/development.md, 类型检查覆盖范围).
files = [
    "xuloom/__init__.py",
    "xuloom/core/engine_config.py",
    "xuloom/core/run_result.py",
    "xuloom/models",
    "xuloom/plugins",
    "xuloom/observability",
    "xuloom/testing",
    "xuloom/server",
    "xuloom/tools/function.py",
    "xuloom/cli_commands.py",
    "xuloom/core/hooks.py",
    "xuloom/core/storage.py",
    "xuloom/core/session_lock.py",
    "xuloom/core/output_limits.py",
    "xuloom/core/tool_catalog.py",
    "xuloom/context/compaction.py",
    "xuloom/desktop/turns.py",
    "xuloom/security/execution.py",
    "xuloom/tools/base.py",
    "xuloom/utils/vcr.py",
    "xuloom/core/engine.py",
    "xuloom/core/engine_state.py",
    "xuloom/core/engine_parts",
    "xuloom/core/model_stream.py",
]

# Engine methods are mostly unannotated; check their bodies anyway, with the shared state's types.
[[tool.mypy.overrides]]
module = ["xuloom.core.engine", "xuloom.core.engine_parts.*", "xuloom.core.model_stream"]
check_untyped_defs = true
